version: '3.8'

services:
  gridwise-api:
    build: .
    container_name: gridwise_energy_optimizer
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
    restart: unless-stopped
